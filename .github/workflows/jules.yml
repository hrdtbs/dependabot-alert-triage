name: Run Jules AI

on:
  push:
    branches:
      - main

jobs:
  run-jules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-labs-code/jules-invoke@v1
        with:
          prompt: |
            1. SPEC.mdとTODO.mdを閲覧
            2. タスクを決定
            3. 実行
            4. 検証
            5. TODO.mdを更新
          jules_api_key: ${{ secrets.JULES_API_KEY }}
